services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:            # pulls models once (several GB on first run)
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      sh -c "ollama pull llama3.1:8b && ollama pull nomic-embed-text"
    restart: "no"

  # latex-worker is added in Phase 5 (sandboxed, internal network only).

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jobpilot
      SPRING_DATASOURCE_USERNAME: jobpilot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STORAGE_DIR: /app/storage
    volumes:
      - files:/app/storage
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend        # multi-stage: ng build -> nginx (proxies /api to backend)
    depends_on: [backend]
    ports:
      - "4200:80"

volumes:
  pgdata:
  ollama:
  files:
