spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/jobpilot}
    username: ${SPRING_DATASOURCE_USERNAME:jobpilot}
    password: ${SPRING_DATASOURCE_PASSWORD:jobpilot}

jobpilot:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
