spring:
  application:
    name: jobpilot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobpilot}
    username: ${SPRING_DATASOURCE_USERNAME:jobpilot}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:change_me}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jobpilot:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  storage-dir: ${STORAGE_DIR:./storage}

# Feature flags: half-built features ship switched off (PROJECT.md 3.9, point 4).
features:
  ats-check: false
  stats: false
  notion: false
  email: false
