server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;   # CV uploads

    # Note: add_header in a location replaces (does not extend) server-level add_header,
    # so the security headers are repeated in every location that sets its own headers.

    # API and health go to Spring Boot on the same origin (no CORS needed).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # synchronous LLM calls (CV import, JD analysis) can take minutes
        proxy_send_timeout 600s;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    # Angular's JS/CSS file names contain a content hash: cache them for a long time.
    location ~* ^/(main|polyfills|styles|chunk)-[A-Za-z0-9]+\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Everything else (index.html via the SPA fallback, vendored Sneat files) must be revalidated,
    # otherwise browsers keep an old index.html that points at an old bundle after a deploy.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
