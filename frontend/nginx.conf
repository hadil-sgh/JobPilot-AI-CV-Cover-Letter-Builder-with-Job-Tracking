server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;   # CV uploads (Phase 2)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API and health go to Spring Boot on the same origin (no CORS needed).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;   # synchronous LLM calls (CV import) can take minutes on small GPUs/CPU
        proxy_send_timeout 600s;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    # SPA fallback: unknown paths serve index.html so Angular routing works on reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
